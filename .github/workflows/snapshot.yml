name: Daily snapshot

on:
  schedule:
    - cron: "17 5 * * *"  # 05:17 UTC, off the hour on purpose
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Live contract tests
        id: contract
        run: uv run pytest -m contract -v 2>&1 | tee contract.log
      - name: Open issue on schema drift
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('core/contract.log', 'utf8').slice(-6000); } catch {}
            const title = 'Contract test failure: Mercadona API drifted';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'contract-drift',
            });
            if (open.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ['contract-drift'],
              body: 'El contract test diario ha fallado: el esquema vivo de la API ya no coincide con el esperado.\n\n```\n' + log + '\n```\n\nActualiza el adaptador y regraba las golden fixtures de `core/tests/fixtures/mercadona/`.',
            });

  snapshot:
    needs: contract
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1  # one zone at a time: be gentle with their infra
      # One flaky zone must not cancel the others. Before this, a single
      # ReadTimeout on alc1 cancelled the in-flight Dia job and cost the whole
      # day's dataset, including the three zones that had already succeeded.
      fail-fast: false
      matrix:
        include:
          - chain: mercadona
            zone: vlc1
          - chain: mercadona
            zone: mad1
          - chain: mercadona
            zone: bcn1
          - chain: mercadona
            zone: alc1
          # Dia serves one anonymous catalog; see DATA_POLICY.md on its zoning.
          - chain: dia
            zone: es-default
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run opencesta snapshot --chain ${{ matrix.chain }} --zone ${{ matrix.zone }} --out ../data
      - uses: actions/upload-artifact@v4
        with:
          name: prices-${{ matrix.chain }}-${{ matrix.zone }}
          path: data/
          retention-days: 30

  publish:
    needs: [contract, snapshot]
    # Publish whatever was captured. A partial day beats no day at all: the
    # missing zone is visible in the release notes and returns tomorrow.
    if: ${{ !cancelled() && needs.contract.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: data/
          merge-multiple: true
      - name: Publish daily release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="prices-$(date -u +%F)"
          if [ -z "$(find data -name '*.parquet' -print -quit)" ]; then
            echo "::error::ninguna zona produjo datos; no se publica una release vacía"
            exit 1
          fi
          # Name the zones actually captured, so a partial day is visible in the
          # release itself instead of looking complete.
          ZONES=$(find data -name '*.parquet' | sed -E 's#.*chain=([^/]+)/zone=([^/]+)/.*#\1/\2#' \
                  | sort -u | tr '\n' ',' | sed 's/,$//; s/,/, /g')
          tar -czf prices.tar.gz data/
          gh release create "$TAG" prices.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "Precios $(date -u +%F)" \
            --notes "Snapshot diario del dataset (Parquet particionado por chain/zone/date).

          Zonas incluidas: ${ZONES}." \
            || gh release upload "$TAG" prices.tar.gz --repo "$GITHUB_REPOSITORY" --clobber

  verify:
    # The dataset's one promise is that it can be queried in a single pass. That
    # broke silently once (each snapshot inferred its own dtypes, so a column a
    # chain never fills was stored as Null and the types clashed across chains
    # and dates). Check the published artifact itself, not just what we wrote.
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
      - name: Download the last two releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p check
          for TAG in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 2 \
                       --json tagName --jq '.[].tagName'); do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern prices.tar.gz --output "check/$TAG.tar.gz"
            tar -xzf "check/$TAG.tar.gz" -C check
          done
      - name: Read every chain and date together
        working-directory: core
        run: |
          uv sync
          uv run python - <<'PY'
          import sys
          from pathlib import Path
          import polars as pl
          from opencesta.models import SCHEMA

          root = Path("../check/data")
          files = list(root.rglob("*.parquet"))
          if not files:
              sys.exit("no se descargó ningún parquet")
          df = pl.read_parquet(root / "**" / "*.parquet")
          nulls = [c for c, t in df.schema.items() if t == pl.Null]
          if nulls:
              sys.exit(f"columnas sin tipo: {', '.join(nulls)}")
          missing = [c for c in SCHEMA if c not in df.columns]
          if missing:
              sys.exit(f"faltan columnas del esquema: {', '.join(missing)}")
          print(f"{len(files)} ficheros, {df.height} filas, "
                f"fechas {sorted(df['captured_at'].unique().to_list())}")
          PY

  alert:
    # A failed snapshot used to be silent: the contract test guards schema drift,
    # but nothing watched the capture itself, so a lost day only showed up if
    # somebody opened the Actions tab.
    needs: [contract, snapshot, publish, verify]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = `Snapshot diario incompleto: ${new Date().toISOString().slice(0, 10)}`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'snapshot-failure',
            });
            if (open.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ['snapshot-failure'],
              body: `Alguna zona no se capturó hoy.\n\n[Ver la ejecución](${
                context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${
                context.runId})\n\nSi es un fallo de red puntual, el reintento del adaptador ya lo absorbe y mañana vuelve solo. Si se repite varios días en la misma zona, mira si la cadena ha cambiado algo.`,
            });

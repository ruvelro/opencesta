name: Weekly catalog enrichment

on:
  schedule:
    - cron: "43 4 * * 1"  # Mondays, before the daily snapshot
  workflow_dispatch:
    inputs:
      limit:
        description: "Max SKUs to fetch this run"
        default: "500"

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5

      # The catalog (SKU -> EAN/brand/origin) is small and slow to build, so it
      # lives in git: each run tops it up and commits the delta. Prices never
      # land here — those go to Releases.
      - name: Fetch latest prices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --pattern prices.tar.gz --dir . --clobber || exit 0
          tar -xzf prices.tar.gz

      # One pass per zone, sharing the catalog. The detail endpoint answers for
      # the warehouse it is asked with, so a product sold only in Madrid has to
      # be asked for from mad1 — enriching vlc1 alone left every zone-exclusive
      # SKU without EAN, and own-brand detection depends on it.
      - name: Enrich
        working-directory: core
        run: |
          uv sync
          for ZONE in vlc1 mad1 bcn1 alc1; do
            uv run opencesta enrich --zone "$ZONE" --prices ../data \
              --catalog ../catalog/mercadona.parquet \
              --limit ${{ inputs.limit || 500 }}
          done

      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/
          git diff --staged --quiet || git commit -m "catálogo: enriquecer SKUs con EAN y marca"
          git push

[project]
name = "opencesta"
version = "0.1.0"
description = "Adaptadores y snapshot del dataset abierto de precios de supermercados españoles"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
]

[project.scripts]
opencesta = "opencesta.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencesta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "contract: live tests against the real APIs (deselected by default)",
]
addopts = "-m 'not contract'"

[tool.ruff]
line-length = 100
target-version = "py311"
